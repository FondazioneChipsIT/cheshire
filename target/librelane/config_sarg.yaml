LINTER_ERROR_ON_LATCH: False

LINTER_VLT: dir::./verilator_cfg.vlt

VERILOG_DEFINES: [FUNCTIONAL, SYNTHESIS]

# Avoid errors on false logic loops
ERROR_ON_SYNTH_CHECKS: False

# Enable plugin for better SystemVerilog support
USE_SLANG: True
SLANG_ARGUMENTS: ['--keep-hierarchy','--allow-use-before-declare','--ignore-unknown-modules','--ignore-assertions', '--ignore-timing']
SYNTH_KEEP_HIERARCHY_MODULES: [
    'cheshire_soc$*',
    'c910_axi_wrap$*',
    'noelv_chs_axi_wrap$*',
    'sargantana_soc_axi_wrap$*',
    'cva6$*', 
    'cva6_hpdcache_subsystem$*',
    'dmi_jtag$*',
    'dm_top$*',
    'gpio$*',
    'clint$*',
    'cheshire_bootrom$*',
    'reg_uart_wrap$*',
    'i2c$*',
    'i2c_fsm$*',
    'spi_host$*',
    'spi_host_fsm$*',
    'serial_link$*',
    'tc_clk*$*',
    'tc_sram$*'
]

# Valid values are AREA 0-3 and DELAY 0-4
# DELAY 4 = fastest, but largest area
# AREA 3 = slowest, but smallest area
SYNTH_STRATEGY: DELAY 4

#SYNTH_EXTRA_MAPPING_FILE: yosys_mapping.v

# SDC files
PNR_SDC_FILE: dir::base.sdc
SIGNOFF_SDC_FILE: dir::base.sdc
FALLBACK_SDC: dir::base.sdc

# Clock
CLOCK_PORT: [clk_i, rtc_i, jtag_tck_i]
CLOCK_PERIOD: 35

# Floorplan
DIE_AREA: [0, 0, 13000, 8000]
CORE_AREA: [50, 50, 12950, 7950]
IO_PIN_ORDER_CFG: dir::pin_order.cfg
FP_SIZING: absolute

# PDN
VDD_NETS: ["VDD"]
GND_NETS: ["VSS"]
VERILOG_POWER_DEFINE: "USE_POWER_PINS"
# Maximum metal width without slotting: 30um
PDN_CORE_RING_VWIDTH: 15
PDN_CORE_RING_HWIDTH: 15
# Ensure minimum spacing for long metals
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5
PDN_CORE_RING: True
PDN_CFG: dir::pdn_cfg.tcl

# Placement 
PL_TARGET_DENSITY_PCT: 35
PL_TIMING_DRIVEN: False
PL_ROUTABILITY_DRIVEN: True
PL_ROUTABILITY_OVERFLOW_THRESHOLD: 0.35

# CTS
RUN_CTS: true
CTS_ROOT_BUFFER: sg13g2_buf_8
CTS_CLK_BUFFERS: ["sg13g2_buf_2","sg13g2_buf_4","sg13g2_buf_8","sg13g2_buf_16"]

# Routing
GRT_ALLOW_CONGESTION: true
GRT_ANTENNA_REPAIR_MARGIN: 30
RT_MAX_LAYER: TopMetal1
RT_CLOCK_MAX_LAYER: TopMetal1
# Potentially leave some antennas after DRT to avoid pin access error bug
DRT_ANTENNA_REPAIR_ITERS: 0

# Timing
DESIGN_REPAIR_REMOVE_BUFFERS: True
RUN_POST_CTS_RESIZER_TIMING: True
RUN_POST_GRT_RESIZER_TIMING: True
RUN_POST_GRT_DESIGN_REPAIR: True
DESIGN_REPAIR_MAX_SLEW_PCT: 20
GRT_DESIGN_REPAIR_MAX_SLEW_PCT: 20
# Fix setup violations
PL_RESIZER_SETUP_REPAIR_TNS_PCT: 100
PL_RESIZER_SETUP_SLACK_MARGIN: 0.40
PL_RESIZER_SETUP_MAX_BUFFER_PCT: 100
GRT_RESIZER_SETUP_REPAIR_TNS_PCT: 100
GRT_RESIZER_SETUP_SLACK_MARGIN: 0.35
GRT_RESIZER_SETUP_MAX_BUFFER_PCT: 100
# Fix hold violations
PL_RESIZER_HOLD_REPAIR_TNS_PCT: 100
PL_RESIZER_HOLD_SLACK_MARGIN: 0.1
GRT_RESIZER_HOLD_REPAIR_TNS_PCT: 100
GRT_RESIZER_HOLD_SLACK_MARGIN: 0.05

RUN_MAGIC_DRC: False
RUN_KLAYOUT_DRC: False

